[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AttentionGuidance"
version = "0.1.0"
description = "The naive implementation of Attention Guidance"
requires-python = ">=3.9"
dependencies = [
    "diffusers>=0.32.1,<0.33",
    "torch>=2.5.1,<2.6",
    "scipy>=1.14.1,<1.15",
    "omegaconf~=2.3.0",
    "accelerate>=1.2,<2",
    "transformers>=4.47.1,<4.48",
    "tqdm",
    "einops",
    "entmax",
    "matplotlib",
    "gradio",
    "gradio_imageslider",
]

[tool.setuptools]
packages = [
    "AttentionGuidance",
    "InferencePipelines",
    "latent_renderer_training",
]
