# RepLDM eval-pipeline config (DECOUPLED from Sana — scorers are upstream pip
# packages, not Sana imports/copies). score.py reads this to decide which metric
# modules under scorers/ to run. Add "geneval"/"dpg"/"fid" here once implemented.

metrics:
  - imagereward     # global-IR (224) + patch-IR (native 224 crops, §13.2)
  - pixel           # weightless decorrelated witnesses (§13.5): colorfulness/sharpness/saturation/clip/contrast
  - clip            # CLIP-Score (canonical 2.5*max(cos,0) @ ViT-B/32) + raw cosine — alignment witness
  - hps             # HPSv2 (v2.1, ViT-H-14) — human preference
  - aesthetic       # LAION aesthetic predictor (CLIP ViT-L/14 + MLP)

# per-scorer params (passed to every Scorer.__init__ / weights_status)
params:
  patch_crops: 5
  clip_model: "ViT-B/32"
  clipscore_w: 2.5

# direction reference for aggregation (higher_better unless noted). pixel metrics
# are "witness" (no optimization direction — used to detect reward-hacking).
metric_meta:
  imagereward:   higher
  patch_ir_mean: higher
  clip_cosine:   higher
  clipscore:     higher
  hpsv2:         higher
  aesthetic:     higher

# fixed sampling recipe used by generate.py — recorded here for reproducibility
# (cross-run control variables; do not vary per metric).
sampling:
  resolution: 1024            # Stage-1 only (height*width <= 1024**2 skips Stage 2)
  num_inference_steps: 50
  guidance_scale: 7.5
  seeds: [0, 42, 123]
