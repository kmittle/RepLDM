    requested_bases: [freeu_backbone_minus_skip]
    required_hook_names: [up_blocks.0_backbone_skip]
    coefficients: [0.0, 0.0, 0.0, 0.0, 0.02, 0.0]

analysis:
  baseline_action: no_op
  identity_control: lazy_zero_identity
  primary_metric: topiq_nr
  minimum_practical_mean_delta: 0.005
  primary_holm_family:
    alpha: 0.05
    actions:
      - spectral_low_native
      - spectral_mid_native
      - spectral_high_native
      - laplacian_native
  mechanism_ablation_family:
    confirmatory_selection: false
    holm_alpha: 0.05
    actions: [semantic_native_ablation, freeu_native_ablation]
  inference:
    crossed_prompt_seed_bootstrap: 10000
    confidence_level: 0.95
    prompt_level_sign_flips: 100000
    random_seed: 2026
  noninferiority_guards:
    hpsv2_ci_lower_min_delta: -0.005
    clip_cosine_ci_lower_min_delta: -0.005
    clipped_fraction_ci_upper_max_delta: 0.001
    mean_saturation_ci_upper_max_delta: 0.005
    contrast_geometric_ratio_interval: [0.95, 1.05]
  pass_rule:
    - lazy_zero_identity_must_be_byte_identical_to_no_op
    - topiq_mean_delta_meets_practical_bound
    - topiq_crossed_ci_lower_is_positive
    - topiq_prompt_sign_flip_passes_primary_holm
    - all_noninferiority_guards_pass
    - every_step_and_score_record_passes_strict_audit
  null_rule: close_fixed_renderer_distillation_and_rl_without_validation
  ablation_rule: semantic_or_freeu_success_cannot_authorize_a_non_attention_claim
