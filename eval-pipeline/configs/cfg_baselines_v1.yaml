# Frozen tuned-CFG development design. This template is CPU-audited only and
# does not authorize generation, validation, test evaluation, renderer work,
# or reinforcement learning.
schema: cfg_baselines_v1
status: cpu_audited_not_authorized
experiment_id: cfg_baselines_development_v1
parent_principle: isolate_scalar_classifier_free_guidance

source_manifest:
  prompts: eval-pipeline/prompts/s5_development.csv
  prompts_sha256: cf9ae37f2c066e5a35712e2aaf6ea637d85281dc7cd2b104fbc07fe1d8e5201e

split_seeds:
  development: [0, 42, 123]

design:
  expected_prompt_count: 12
  expected_action_count: 5
  expected_seed_count: 3
  expected_block_count: 36
  expected_task_count: 180
  baseline_action_id: cfg_7p5
  action_ids: [cfg_2p5, cfg_5p0, cfg_7p5, cfg_10p0, cfg_15p0]
  cfg_scales: [2.5, 5.0, 7.5, 10.0, 15.0]
  action_sha256:
    cfg_2p5: abb198d46192f0a1bac2570d170f793e576581ebf2dc07779d8df48846d82407
    cfg_5p0: ebb8a944a03d6b6d753ec6739754ee61a9567da0a2e3fe665957e1ba403e7346
    cfg_7p5: 6800bd507e62c0c9af6fbe739f9914750779d957324f68a5499931fbbb747fac
    cfg_10p0: fe05b093c4d39593190da100f2f49626754bcea160e6d835499e133a153e6ce9
    cfg_15p0: b187e997d3d5c1f31a0ad51bf418edd7da6f44a0b4e7eb2d718b17e3806ff035

sampling:
  model: stabilityai/stable-diffusion-xl-base-1.0
  model_revision: 462165984030d82259a11f4367a4eed129e94a7b
  base_scheduler: EulerDiscreteScheduler
  resolution: 1024
  num_inference_steps: 50
  default_cfg_scale: 7.5
  negative_prompt: blurry, ugly, duplicate, poorly drawn, deformed, mosaic
  power_calibrate: 0
  stage2: false
  extra_unet_calls: 0
  initialization: scheduler_native_init_sigma
  cfg_source: action.cfg_scale
  cfg_pipeline_argument: guidance_scale
  guidance_rescale: 0.0

scheduler_runtime:
  config_sha256_v2: 6bf0509f22d8d3a06d6493c2291af8655f6f74846b2d2eae3cf71b5cda000102
  num_inference_steps: 50
  schedule_sha256: 302d2452f411bf3eea64f8dd3530e232b95c23aed7b818ed6697982a4428c144
  construction_init_noise_sigma: 14.648818969726562
  effective_init_noise_sigma: 13.158469200134277

scoring:
  metrics: [pixel, clip, hps, iqa]
  strict: true
  params:
    patch_crops: 5
    clip_model: ViT-B/32
    clipscore_w: 2.5
  required_score_keys:
    - colorfulness
    - laplacian_sharpness
    - clipped_fraction
    - mean_saturation
    - contrast_std
    - clip_cosine
    - clipscore
    - hpsv2
    - topiq_nr

execution_order:
  version: action-order-v1
  grouping: [prompt_index, seed]
  digest: sha256
  input: "action-order-v1:{prompt_index}:{seed}:{action_id}"
  sort: ascending_raw_digest
  single_device_per_group: true

selection:
  baseline_action_id: cfg_7p5
  primary_metric: topiq_nr
  minimum_mean_delta: 0.005
  topiq_ci_level: 0.95
  topiq_holm_alpha: 0.05
  bootstrap: 10000
  randomizations: 100000
  seed: 2026
  guard_familywise_alpha: 0.05
  hpsv2_lower_min_delta: -0.005
  clip_cosine_lower_min_delta: -0.005
  clipped_fraction_upper_max_delta: 0.001
  mean_saturation_upper_max_delta: 0.005
  contrast_ratio_min: 0.95
  contrast_ratio_max: 1.05
  practical_tie_delta: 0.005
  tie_break:
    - closest_to_cfg_7p5
    - lower_cfg_scale
    - registered_action_order

actions:
  - id: cfg_2p5
    type: none
    cfg_scale: 2.5
  - id: cfg_5p0
    type: none
    cfg_scale: 5.0
  - id: cfg_7p5
    type: none
    cfg_scale: 7.5
  - id: cfg_10p0
    type: none
    cfg_scale: 10.0
  - id: cfg_15p0
    type: none
    cfg_scale: 15.0
