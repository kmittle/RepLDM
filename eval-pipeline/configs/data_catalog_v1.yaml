training_views:
  - schema: repldm.training_view.v1
    id: opd_prompt_pool
    artifact: training_candidates.jsonl
    filter: {prompt_is_not_null: true}
    expected_rows: 275217
    notes: Prompts for on-policy student rollout followed by teacher labeling.
  - schema: repldm.training_view.v1
    id: opd_reference_image_text
    artifact: training_candidates.jsonl
    filter: {modality_in: [image_text]}
    expected_rows: 225217
    notes: High-quality image-text pairs for initialization and representation checks.
  - schema: repldm.training_view.v1
    id: dpo_prompt_pool_requires_pair_generation
    artifact: training_candidates.jsonl
    filter: {prompt_is_not_null: true}
    expected_rows: 275217
    notes: These are prompts, not preference pairs; generate matched candidates and labels before DPO.
  - schema: repldm.training_view.v1
    id: rl_prompt_pool
    artifact: training_candidates.jsonl
    filter: {prompt_is_not_null: true}
    expected_rows: 275217
    notes: Prompt pool for reward-guided rollout; keep evaluation prompts excluded.
  - schema: repldm.training_view.v1
    id: latent_structure_pretraining
    artifact: training_candidates.jsonl
    filter: {modality_in: [image_only, image_style]}
    expected_rows: 37877
    notes: Image-only initialization; do not treat these rows as text supervision.

