schema: repldm.data_catalog.v1
output_dir: DATA

training_license_policy:
  allowed_statuses:
    - verified_from_dataset_card
    - verified_from_local_geneval_repository
  mode: fail_closed

payload_integrity_policy:
  catalog_role: candidate_inventory
  training_ready: false
  requirement: A selected training view must have a complete SHA-256 payload manifest before training.

expected_protected_normalized_unique_prompts: 46619
expected_protected_unique_images: 37160
expected_holdout_stats:
  rows: 49393
  training_eligible_rows: 0
  rows_with_prompt: 49393
  rows_with_image: 39712
  missing_images: 0
  benchmark_exact_match_rows: 49393
  modalities:
    benchmark_image_text: 39712
    benchmark_prompt: 9681
  splits:
    heldout: 49393

physical_sources:
  - id: pixel_render_miah204
    path: /mnt/miah204/bycao/Pixel-Render
    role: code_and_high_resolution_data
    logical_datasets:
      - pixel_render_image_only
      - aesthetic_4k
      - style30k
      - omnistyle_available
      - 4klsdb_metadata_mirror
    notes: Contains the 5,058,099-row image manifest and several extracted datasets.
  - id: sana_miah204
    path: /mnt/miah204/bycao/Sana
    role: code_manifests_and_post_training_prompts
    logical_datasets:
      - four_k_lsdb
      - sana_pickscore_prompts
      - sana_ocr_prompts
      - sana_geneval_prompts
      - sana_drawbench_prompts
    notes: Contains the usable 4KLSDB manifest and prompt pools used by Sana post-training.
  - id: pixel_render_miah209
    path: /mnt/miah209/bycao/Pixel-Render
    role: image_payloads_and_benchmarks
    logical_datasets:
      - four_k_lsdb_images
      - pixverve_95k
      - pixverve_benchmark
      - mjhq_30k_benchmark
      - geneval_repository
    notes: Holds image payloads; MJHQ, GenEval test, and PixVerve-Bench are benchmark-only.
  - id: sana_data_miah209
    path: /mnt/miah209/bycao/sana_data
    role: derived_feature_cache
    logical_datasets:
      - sana_4klsdb_text_features
    notes: Eight packed Gemma-2-2B feature shards derived from the 4KLSDB manifest.
  - id: sana_runs_miah209
    path: /mnt/miah209/bycao/sana_runs
    role: run_provenance_not_training_data
    logical_datasets: []
    notes: Checkpoints, logs, and resolved configs; this directory is not a new dataset.

